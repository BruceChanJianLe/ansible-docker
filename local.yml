- hosts: localhost
  vars:
    nvidia_docker_gpg_key_url: "https://nvidia.github.io/libnvidia-container/gpgkey"
    nvidia_toolkit_repository_url: "https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list"

  pre_tasks:
  - name: Check for classic sudo (sudo.ws)
    become: false
    ansible.builtin.stat:
      path: /usr/bin/sudo.ws
    register: sudo_ws
    tags: always

  - name: Prefer classic sudo where sudo-rs is the default
    become: false
    ansible.builtin.set_fact:
      ansible_become_exe: "{{ '/usr/bin/sudo.ws' if sudo_ws.stat.exists else '/usr/bin/sudo' }}"
    tags: always

  - name: Update Apt
    become: true
    apt:
      upgrade: no
      force_apt_get: true
      update_cache: true
      cache_valid_time: 86400 #One day
      state: present
    when: ansible_facts['os_family'] == "Debian"

  - name: Update Package Manager
    become: true
    pacman:
      update_cache: true
      state: present
    when: ansible_os_family == "Archlinux"

  tasks:
    - include_tasks: tasks/setup-Debian.yml
      when: ansible_os_family == 'Debian'
      tags: [docker, nvidia-docker]
    - include_tasks: tasks/setup-Archlinux.yml
      when: ansible_os_family == "Archlinux"
      tags: [docker, nvidia-docker]

